# ==============================================
# MangoHud 配置文件（不使用 full，显式启用所有 full 监控指标）
# 基于你现有配置，补充所有缺失的 full 参数（histogram 除外）
# ==============================================

# ---------- 日志与输出 ----------
output_folder = ~/.log/         # 日志输出目录（必须）
log_duration = 600              # 日志记录时长（秒）
log_interval = 0                # 记录间隔（毫秒，0 表示每帧）
# log_versioning                # 启用后日志包含版本信息（默认禁用，你已注释）
toggle_logging = Shift_L+F2     # 切换日志记录热键
# autostart_log = 0             # 启动后延迟自动记录（秒），默认禁用

# ---------- 显示与布局 ----------
toggle_hud = Shift_R+F12        # 切换 HUD 显示
alpha = 0.5                     # 全局透明度（0.0~1.0）
background_alpha = 0.4          # 背景透明度（0.0~1.0）
font_size = 20                  # 主字体大小
font_size_secondary = 14        # 次要指标字体大小
offset_x = 400                  # 水平偏移（像素）
offset_y = 0                    # 垂直偏移（像素）
legacy_layout = 0               # 使用新版布局（0=新版，1=旧版）
# horizontal                    # 水平布局（默认禁用，你已注释）

# ---------- 时间与系统信息 ----------
time                            # 显示本地时间
arch                            # 显示应用位数（32/64）
gamemode                        # 显示 GameMode 状态
display_server                  # 显示当前显示服务器（X11/Wayland）
# wine                          # 显示 Wine/Proton 版本
# wine_color                    # Wine 文本颜色

# ---------- FPS 与帧时间 ----------
fps                             # 显示帧率（默认启用）
frametime                       # 显示帧生成时间
fps_color_change                # 根据 FPS 值改变颜色
fps_metrics = avg               # 显示平均 FPS
# frame_count                   # 显示总帧数
frame_timing_detailed           # 显示详细帧时序图表（full 包含）
dynamic_frame_timing            # 帧时间图 Y 轴自适应（full 包含）

# ---------- 仅 Gamescope 有效 ----------
fsr                             # 显示 FSR 状态
hdr                             # 显示 HDR 状态
refresh_rate                    # 显示当前刷新率

# ---------- CPU 监控 ----------
cpu_stats                       # 开启 CPU 统计组
cpu_power                       # 显示 CPU 功耗
cpu_temp                        # 显示 CPU 温度
cpu_load                        # 显示 CPU 使用率
cpu_load_change                 # 根据负载改变 CPU 颜色
cpu_mhz                         # 显示 CPU 当前频率
core_load                       # 显示每个核心的负载与频率
core_bars                       # 将核心负载显示为垂直条形图
core_load_change                # 根据负载改变核心颜色
core_type                       # 显示核心类型（P/E核或 ARM 代号，full 包含）
cpu_efficiency                  # 显示 CPU 能效（帧/焦耳，full 包含）

# ---------- GPU 监控 ----------
cpu_stats                       # 开启 GPU 统计组
gpu_power                       # 显示 GPU 功耗
gpu_temp                        # 显示 GPU 温度
gpu_core_clock                  # 显示 GPU 核心频率
gpu_load_change                 # 根据负载改变 GPU 颜色
gpu_name                        # 显示 GPU 名称
gpu_list = 0,1                  # 显示两个 GPU（索引 0 和 1）
# gpu_voltage                   # 显示 GPU 电压
gpu_load                        # 显示 GPU 使用率（full 包含，默认启用）
gpu_mem_clock                   # 显示 GPU 显存频率（full 包含）
gpu_fan                         # 显示 GPU 风扇转速（full 包含）
gpu_efficiency                  # 显示 GPU 能效（帧/焦耳，full 包含）
gpu_power_limit                 # 显示 GPU 功耗限制（full 包含）
throttling_status               # 显示 GPU 降频状态（full 包含）
throttling_status_graph         # 在帧时间图中显示降频状态（full 包含）

# ---------- 内存监控 ----------
proc_vram                       # 显示进程显存使用量
ram                             # 显示系统内存使用量
ram_temp                        # 显示内存温度（DDR5 + spd5118）
# vram                          # 显示总显存使用量
swap                            # 显示交换分区使用量（full 包含）
procmem                         # 显示进程内存 RSS（full 包含）
procmem_shared                  # 显示进程共享内存（full 包含）
procmem_virt                    # 显示进程虚拟内存（full 包含）

# ---------- 其他监控指标（full 包含） ----------
engine_version                  # 显示 OpenGL/Vulkan 引擎版本
# engine_short_names            # 显示引擎短名称
vulkan_driver                   # 显示使用的 Vulkan 驱动
present_mode                    # 显示 Vulkan 当前呈现模式
resolution                      # 显示当前分辨率（full 包含）
io_read                         # 显示磁盘读取速率（MiB/s，full 包含）
io_write                        # 显示磁盘写入速率（MiB/s，full 包含）
network                         # 显示网络收发速率（kb/s，full 包含）
fan                             # 显示 Steam Deck 风扇转速（full 包含）
battery                         # 显示电池百分比和能耗（full 包含）
# （若需要电池图标/瓦时/剩余时间，可添加 battery_icon, battery_watt, battery_time）
flip_efficiency                 # 交换能效单位（焦耳/帧，full 包含）
winesync                        # 显示 Wine 同步方式（full 包含）
fex_stats                       # 显示 FEX-Emu 统计信息（full 包含）
ftrace                          # 显示 ftrace 跟踪事件（full 包含）
version                         # 显示 MangoHud 版本（full 包含）
exec_name                       # 显示当前进程名（full 包含）
